baseURL = "https://www.minahabib.com/"
languageCode = "en-us"
title = "Mina Habib"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
pygmentsUseClasses = true

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  title = "Mina Habib"
  description = "Writing on data science, forecasting, and the things I'm figuring out."
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = "Hi, I'm Mina"
    Content = "Senior Data Scientist. I build machine learning models, with a soft spot for forecasting. I write here about the work and what I'm figuring out."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Gr0d3N"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/mina-habib/"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Blog"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]
